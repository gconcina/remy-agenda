[package]
name = "remy-agenda"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Una agenda tipo libreta con checklist y notificaciones para COSMIC Desktop"
repository = "https://github.com/gconcina/remy-agenda"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_6"] }
gio = "0.21"
glib = "0.21"
libadwaita = "0.8"
tokio = { version = "1.40", features = ["full", "macros", "rt-multi-thread"] }

# Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
uuid = { version = "1.8", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
anyhow = "1.0"
thiserror = "1.0"

# Notifications
notify-rust = "4.10"

# Tray icon (StatusNotifier para el panel COSMIC)
ksni = "0.2"

# Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev]
debug = true